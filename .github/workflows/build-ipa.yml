name: Build tvOS IPA

on:
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build Archive
        run: |
          xcodebuild -workspace Stratix.xcworkspace \
            -scheme Stratix-Release \
            -sdk appletvos \
            -configuration Release \
            -archivePath build/Stratix.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            build archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Stratix.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r Stratix-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratix-tvOS-IPA
          path: build/Stratix-unsigned.ipa
