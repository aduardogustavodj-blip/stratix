name: Build tvOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          swift --version

      # Шаг патча: понижаем версию swift-tools с 6.2 до 6.1 во всех пакетах
      - name: Patch Swift Tools Version
        run: |
          find Packages/ -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.1/g' {} +
          echo "Patched Swift tools version to 6.1"

      - name: Build Archive
        run: |
          xcodebuild -workspace Stratix.xcworkspace \
            -scheme Stratix-Debug \
            -sdk appletvos \
            -configuration Debug \
            -archivePath build/Stratix.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Stratix.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r Stratix-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratix-tvOS-IPA
          path: build/Stratix-unsigned.ipa
